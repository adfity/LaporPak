name: LaporPak

services:
  db:
    image: mysql:8.0
    container_name: laravel10-lp
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data_laporpak:/var/lib/mysql

volumes:
  db_data_laporpak: